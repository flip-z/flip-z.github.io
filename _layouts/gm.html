<!DOCTYPE html>
<html lang="en" class="gm-locked">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <script>try{if(sessionStorage.getItem("gm:breach-below-bergum")==="unlocked"){document.documentElement.classList.remove("gm-locked");document.documentElement.classList.add("gm-unlocked")}}catch(e){}</script>
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <link rel="icon" href="{{ '/crescent.png' | relative_url }}" type="image/x-icon">
    {% seo %}
    {% include head/fonts.html %}
    {% include head/styles.html %}
    <script src="{{ '/assets/js/gm-gate.js' | relative_url }}" defer></script>
</head>
<body class="adventure-page gm-page">
    {% include header.html %}
    {% include gm-gate.html %}
    <main class="adventure-shell gm-content" id="gm-content">
        {% include navigation.html %}
        {% include adventure-nav.html %}
        {% include gm-nav.html %}
        <div class="gm-toolbar"><button class="button-link button-subtle" type="button" data-gm-lock>Lock GM pages</button></div>
        <article class="adventure-content">
            {{ content }}
        </article>
    </main>
</body>
</html>
