workflow:
  canonical_source: _data/adventures/forests-hart/
  current_arc:
    - Ministry arrives after Elara's reports of a large malformed hare killing pets and poultry finally push Coedmyr above the threshold for investigation.
    - Early branches separate mundane neglect from impossible biological excess and establish that the forest's decline has both ordinary and supernatural components.
    - Maelin, Nessa, Sera, Taran, old records, and surviving relics reveal a spiritual ecology organized around life, death, change, and tradition rather than one lost killing rite.
    - The party finds the Hart trapped on Ewan's neglected line and discovers that its vitalizing nature has become a corrupting force in a broken stewardship system.
    - The party prepares a restoration using whatever fragments of the old system it has recovered and enters the finale intending to save the Hart.
    - The rescue initially works, then breaks down and turns into an improvised pursuit as the corrupted Hart flees or containment collapses.
    - Final containment reveals that the corruption is inseparable from this manifestation. The party must choose whether to use the Wolf's Tooth to kill it, continue searching for another solution, or abandon Coedmyr.

  cosmology:
    hart: life, vitality, renewal, recovery
    wolf: death, limits, predation, restraint
    bird: change, movement, adaptation, transition
    turtle: tradition, continuity, memory, persistence
    rule: The spirits are overlapping cultural figures, not a rigid four-part puzzle. Their themes become mechanically relevant through surviving stewardship tools and practices.

  investigation_rule: Clues should support a plausible rescue theory without automatically revealing that the Hart cannot be saved.
  npc_rule: Named villagers are partial witnesses, not exposition channels. Distinguish what each NPC knows from what they believe and what they volunteer. Begin with immediate lived experience; broader interpretation should emerge only when the party asks relevant questions, presents evidence, or earns trust.
  finale_rule: The finale begins as restoration, not a ritual hunt. Any hunt emerges only after the rescue breaks down.
  choice_rule: No historical source tells the party to kill the Hart. The lethal use of the Wolf's Tooth must be inferred from its established function as a tool of limits.
  communal_rule: Villager participation reflects relationships and renewed responsibility. Earlier interactions should matter most when the village fractures over whether to keep trying to save the Hart.
  alternative_solution_rule: A player-devised rescue that is genuinely supported by established fiction and carries an appropriate cost should remain possible; do not protect the planned tragedy by fiat.
