npcs:
  - id: npc-sage
    name: Maelin Tor
    role: elderly keeper of old Coedmyr language, relics, and local tradition
    public_reputation: Knows more old Coedmyr material than anyone left, but speaks an archaic local dialect that modern villagers struggle to understand.
    communication: Maelin is not cryptic. He speaks plainly in an old dialect. Nessa translates incompletely and sometimes incorrectly; PCs with relevant Society, Lore, Occultism, or linguistic knowledge can catch words, context, or errors.
    belief: Coedmyr abandoned obligations that once accompanied its reverence for the forest. He thinks the village preserved symbols more successfully than the habits, labor, and coordination that made the old traditions useful.
    knows:
      - old Coedmyr hunting and stewardship traditions
      - the Wolf as a continent-wide figure of necessary predation, culling, selection, and limits
      - the Hart as a continent-wide figure of renewal, succession, recovery, and replacement after loss
      - the great River Turtle as a figure of persistence, circulation, water, soil, and long-duration systems
      - the great Bird as a figure of movement, migration, dispersal, seasonal change, and passage between places
      - regional stories disagree on names, relationships, and exact forms of these spirits
      - the pilgrimage overlook once housed a keeper who watched forest conditions and coordinated practical obligations distributed across the village
      - hunters, farmers, shrine tenders, craftspeople, and others once shared responsibilities that no single keeper performed alone
      - many inherited objects in his house belonged to pilgrimage and hunting practices
      - the Wolf's Tooth is a human-forged ritual object associated with the Wolf and the old hunt once its context is recognized
    functions:
      - provides historical and cultural context rather than a procedural answer
      - can identify the Hart after hearing a sufficiently distinctive description
      - can retrieve the Wolf's Tooth when the party mentions the Wolf, the old hunt, the shrine implements, or the bell
      - allows a careful search of his crowded house to discover the Wolf's Tooth early
      - supplies unrelated spirit stories, obsolete customs, and disputed translations so his lore does not read as a concentrated quest solution
      - gives one sharp interpretation of Coedmyr's decline without being treated as the adventure's authoritative moral voice
    limits:
      - does not know the complete current ritual procedure
      - does not know why the present Hart manifestation has remained
      - does not know that the Wolf's Tooth is the correct bell striker until the party demonstrates it

  - id: npc-translator
    name: Nessa Tor
    role: Maelin's granddaughter, caretaker, and imperfect translator of archaic Coedmyr speech
    belief: The old stories matter, but inherited words and objects are not the same thing as a functioning tradition. She is less willing than Maelin to blame people who inherited a village already in decline.
    functions:
      - keeps Maelin's conversations accessible without making translation exact
      - simplifies, guesses, argues with Maelin, and occasionally mistranslates old ecological or ritual terms
      - can recall fragments of Hart, Wolf, Turtle, and Bird stories that are culturally useful but not necessarily relevant to the case
      - can participate in final preparations if the party has involved her and earned her confidence

  - id: npc-blacksmith
    name: Taran Holt
    role: practical blacksmith and skeptical local craftsman
    public_reputation: Busy, capable, and uninterested in village mysticism unless it produces a practical problem.
    belief: Most surviving folklore is unreliable, and people cannot maintain every old custom after the population and economy that supported them disappear. Useful practices can still be understood by what they accomplished.
    knows:
      - the Wolf's Tooth is cold iron
      - it was fashioned to mount on a haft
      - its shape corresponds to an obsolete ceremonial regional implement
      - the object is human-made rather than a literal tooth or fragment of a spirit
    functions:
      - provides an early practical introduction to village conditions
      - shows the party a mundane completed analogue once shown the relic
      - helps reconstruct the traditional implement after the party earns his cooperation
      - can participate in final preparations if the party has involved him and earned his cooperation
    cooperation_paths:
      - assist with ordinary shop work
      - gain his practical trust elsewhere
      - bring relevant overlook research
    research_synergy: Overlook library material about traditional Coedmyr tools makes reconstruction easier.

  - id: npc-hunter
    name: Ewan Rusk
    role: skeptical local hunter
    public_reputation: Experienced woodsman frustrated by the collapse of local game populations.
    belief: The region's problems have mundane causes until direct evidence changes his mind. He sees declining hunting effort as a response to scarcity even when he recognizes that abandoned traps and neglected lines are irresponsible.
    situation: He has neglected parts of his trap line because game has become scarce. Other local hunters have also shortened routes or stopped coordinating responsibilities as the forest and village declined. Ewan went further by leaving traps unattended. He does not know that a physical manifestation of the Hart reached one of those traps or that this incidental failure became the accelerant for the recent supernatural escalation.
    functions:
      - tells the party where his trap line runs
      - can guide the party toward the Hart's current source location
      - if not already encountered, can enter the first dusk incursion and help finish the final malformed animal
      - can participate in final preparations after seeing the consequences of his neglected line
      - provides one concrete example of a wider breakdown in hunting stewardship without becoming uniquely responsible for Coedmyr's long decline
    limits:
      - does not recognize the Hart by lore alone
      - does not interpret the old rite or supply supernatural explanations

  - id: npc-mayor
    name: Elara Venn
    role: mayor of Coedmyr and Ministry contact
    belief: The village is facing a serious environmental or supernatural problem and repeated ordinary explanations no longer account for everything she has seen. She resists simple blame because Coedmyr has spent years losing people, money, and capacity while asking for help.
    functions:
      - requested Ministry assistance for several years
      - briefs the party on tainted water, failed crops, and aggressive malformed wildlife
      - explains Coedmyr's long decline from remote pilgrimage destination to isolated village
      - provides civic context and access to local records
      - can help draw interested residents into final preparations once convinced of the immediate emergency
    chicken_claim: Claims a slaughtered and dressed chicken got off her kitchen counter and killed a neighbor's cat. She retained no physical evidence. The GM need not establish whether the story is fully true, exaggerated, or fabricated to force Ministry attention.

  - id: npc-overlook-attendant
    name: Sera Wynn
    role: caretaker of the pilgrimage overlook and steward of its surviving archive
    belief: Coedmyr's traditions were worth preserving, and keeping the overlook alive mattered even as the pilgrimage economy changed. She takes the surviving lessons about respect for and attention to the forest seriously without knowing the full institution that once stood behind them.
    public_reputation: Earnest and protective of the forest. Skeptical outsiders can initially read her as a romantic preservationist more interested in old customs than practical problems.
    site_context: Sera apprenticed under the previous caretaker and later inherited responsibility for the overlook. In her younger years the site survived partly on meditation, tea, exercise, scenic retreats, and simplified ceremonies. She benefited from that economy and took the traditions seriously. Her training preserved ceremonies, stories, habits, and moral lessons, but not the deeper institutional history or complete working requirements of the old keeper office.
    knows:
      - the route of the spirit trail
      - the existence of the old shrine
      - where relevant local records are kept in the overlook library
      - the Wolf and Hart appear together in some old hunting and stewardship traditions
      - Turtle and Bird traditions also appear in Coedmyr records without bearing directly on the present hunt
      - old pilgrimage material treats care for the forest as involving observation, limits, movement, maintenance, harvest, and active management as well as reverence
    functions:
      - provides one independent route to discovering the shrine
      - introduces the Hart in old records if the party has not already heard the name
      - directs research toward old hunt, stewardship, and tool traditions without revealing the present-day solution
      - can participate in final preparations if the party trusts and involves her
    limits:
      - does not know that the overlook once coordinated a wider village stewardship institution unless the party uncovers that history with her
      - does not know the complete rite or possess hidden procedural knowledge needed to solve the finale
