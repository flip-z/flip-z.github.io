difficulty:
  party_level: 10
  baseline_dc: 27
  bands:
    very_easy: 22
    easy: 25
    standard: 27
    hard: 29
    very_hard: 32
  guidance:
    - Keep most investigation and social checks between 25 and 29.
    - Required information is never lost on a failed check; failure costs time, position, certainty, or adds another route.
    - DC 32 represents a genuinely dangerous exposure or difficult early inference.

investigation_style:
  description_rule: Describe observable physical evidence before supplying interpretation. Early scenes should remain plausibly readable as neglect, ecological decline, disease, or forest reclaiming a shrinking village.
  inference_rule: No number of successful clue checks automatically reveals the adventure's final choice.
  underlying_model: The Hart's vitalizing nature has become distorted after it was injured and trapped inside a spiritual ecology already weakened by lost stewardship. Growth, healing, repair, reproduction, inflammation, and recovery continue past healthy limits or develop in destructive forms.
  evidence_pattern: Emphasize excessive life rather than failed transition: wounds overgrow, bone remodels uselessly, infection survives under fresh tissue, fungi and shoots proliferate, and regeneration continues beyond function.
  terminology: Use corruption or runaway vitality in GM-facing text. The corruption is emergent from the Hart's distorted life-giving nature rather than an external possessing substance.
  chicken_claim: No physical evidence is available from Elara. Treat reliability as unresolved unless play establishes otherwise.
  spring:
    basic_finding: A badly decomposed animal lodged at the source provides a mundane explanation for the local water contamination.
    useful_result: The larger forest abnormalities remain, ruling out the spring itself as a sufficient explanation for the regional problem.

pursuit:
  target_obstacles: 8
  conditional_obstacle: Reacquire the Hart if it was freed before the restoration attempt.
  obstacle_dc_pattern:
    best_fit: 25
    secondary: 29
    awkward_but_plausible: 32
  failure_effect: Increase breach pressure rather than ending the pursuit.
  framing: The chase emerges when the attempted rescue breaks down. It is not a known ritual hunt.

spirit_trail:
  optional_forest_hooks:
    - abnormal animal cries from deeper woods
    - malformed tracks crossing the old route
    - abandoned or damaged trapping infrastructure intersecting Ewan's line
  rule: Use these only when the party has not already meaningfully entered the forest or discovered Ewan's neglected line. They redirect toward existing content rather than creating new nodes.

hart_source:
  approach:
    warning_distance: Begin obvious environmental escalation one to two minutes before reaching the trap.
    signs:
      - damaged vegetation produces excessive competing fresh shoots
      - fungal activity, insects, flowering, nesting, and fresh growth occur at implausible intensity
      - wounds and breaks show repeated regeneration without useful restoration
      - abnormalities intensify toward the Hart rather than beginning abruptly at the mechanical aura boundary
  presentation:
    - Do not rely on antlers to identify the Hart.
    - Its coat, eyes, proportions, movement, and presence should make it immediately clear that it is not ordinary wildlife.
    - It should appear sacred, distressed, and visibly corrupted while remaining sympathetic enough that rescue feels like the obvious goal.
    - Show malformed healing and new growth intruding on otherwise graceful anatomy.
  aura:
    radius_feet: 25
    save: Fortitude
    dc: 32
    trigger: Entering the radius or beginning a turn within it during structured play.
    manifestations:
      - old scars inflame or thicken
      - minor cuts rapidly produce excessive tender tissue
      - nails or hair grow painfully at the roots
      - swelling develops around old injuries
      - wounds begin sealing around dirt or foreign material
    guidance: Treat these as runaway vitality expressed through the exposed creature's own body, not exposure to an external poison or possession.
  doe:
    forensic_findings:
      - bone remodeling continues around the trap jaws but overgrows useful alignment
      - inflammation and infection remain active beneath layers of new tissue
      - skin or muscle repair incorporates debris or forms useless masses
      - the apparent amount of healing does not match the age of the injury
    mundane_finding: The trap itself is ordinary and does not carry a poison, curse, unusual alloy, or mechanism that explains the condition.
    spiritual_read:
      dc: 27
      skills: [Nature, Occultism, relevant Order of Twilight ability]
      result: Life and repair are being unnaturally intensified by a broader spiritual influence. This does not identify the Hart as the source or reveal whether the Hart can be saved.

spirit_tools:
  wolf_tooth:
    mechanical_role: Suppress, interrupt, or impose limits on runaway growth and spiritual effects.
    narrative_rule: Establish this function repeatedly before the finale. Do not present the Tooth as a Hart-killing weapon or relic of a prescribed hunt.
    final_use: Once the corrupted Hart is sufficiently restrained, the same limiting function can be turned lethally against the manifestation without a final attack roll or check.
  turtle:
    status: design-space
    mechanical_role: Stabilize a boundary or hold a suppressed state longer.
    requirement: Optional advantage, not a gate.
  bird:
    status: design-space
    mechanical_role: Guide movement, redirect spillover, or improve pursuit positioning.
    requirement: Optional advantage, not a gate.
  hart:
    mechanical_role: Healing, calming, husbandry, tending, and restoration actions can improve the attempted rescue or temporarily reduce pressure.
    item: none

npc_checks:
  elara_venn:
    volunteers:
      - three outbreak symptoms
      - timeline of recent escalation
      - useful local contacts and basic town access
      - Coedmyr's history as a remote pilgrimage destination whose visitors disappeared as the forest and rites declined
    dc_25:
      skills: [Diplomacy, Society]
      result: Learn politically sensitive context about village morale, disputes, and who trusts whom.
    finale_position: Once restoration demonstrably cannot hold, she prioritizes village survival over preserving the Hart.
    does_not_know:
      - the Hart's identity at arrival
      - a hidden ritual solution
      - whether the spring contamination shares the larger cause

  maelin_tor:
    communication: Speaks an archaic local dialect rather than cryptic fragments. Nessa provides imperfect translation.
    volunteers:
      - criticism of modern Coedmyr's neglect of the forest, history, and old obligations
      - old stewardship context when the party asks about pilgrimage or hunting traditions
      - stories linking the Hart with life, Wolf with death, Bird with change, and Turtle with tradition
      - fragments about the old practical keeper or warden whose duties included shrines, trails, culling, harvest limits, adaptation, recordkeeping, and continuity
    comprehension_checks:
      dc_25:
        skills: [Society, Lore, Occultism]
        result: Catch useful old words, correct part of Nessa's translation, or recognize the ecological meaning of a custom without gaining procedural instructions.
      dc_29:
        skills: [Society, Lore, Occultism]
        result: Recover a more precise understanding that the four spirit traditions describe forces kept in relationship rather than a fixed ritual sequence.
    wolf_tooth:
      early_discovery:
        dc: 27
        skills: [Perception, Society, relevant Lore]
        result: Notice the unusual dark-metal tooth among the house's many relics before its importance is understood.
      contextual_trigger: Mentioning the Wolf, unusual stewardship implements, the shrine, or the bell prompts Maelin to identify and retrieve the object from his collection without a check.
      safeguard: Failure to find it early never removes it from the adventure.
    finale_position: Can recognize the Wolf's principle of death and limits and infer what the Tooth might do, but never claims tradition commands the Hart's death.
    does_not_know:
      - a complete ritual procedure
      - whether the current Hart can ultimately be restored

  taran_holt:
    volunteers_when_shown_relic:
      - cold iron identification
      - mounting points
      - resemblance to an obsolete ceremonial working implement
      - confirmation that the Tooth is human-forged rather than an actual tooth or spirit fragment
    cooperation:
      automatic_if:
        - party assists with practical shop work
        - party has earned his practical trust
        - party brings relevant overlook research
      otherwise:
        dc: 27
        skill: Diplomacy
    crafting_support:
      dc: 25
      skill: Crafting
      effect: Earn trust faster or improve reconstruction position; failure never blocks reconstruction or damages the relic.
    finale_position: Focuses on the practical evidence that containment is failing rather than asserting a spiritual answer.

  ewan_rusk:
    volunteers:
      - local game has become scarce
      - parts of his trap line have gone unchecked
      - route of the trap line
    dusk_introduction: If the party has not already met or sought him out, Ewan can enter the first dusk incursion and help finish the final malformed creature.
    follow_trap_line:
      with_directions_dc: 25
      without_guide_dc: 27
      skill: Survival
    accompany_party:
      before_evidence_dc: 27
      skill: Diplomacy
      after_evidence: substantially easier or automatic
    restoration_support: Once he sees what his unattended trap caused, he has a strong personal reason to help save the Hart.
    finale_position: May resist killing the Hart because the decision makes the consequence of his negligence irreversible.
    limits:
      - does not identify the Hart from folklore before others establish it
      - does not explain the spiritual solution

  sera_wynn:
    volunteers:
      - spirit trail location
      - shrine existence
      - access to overlook library
      - history of the overlook as a surviving spiritual retreat and tourist attraction
    research:
      basic_history: automatic
      four_spirit_context:
        dc: 25
        skills: [Society, Lore, Religion, Occultism]
        result: Find traditions linking Hart with life, Wolf with death, Bird with change, and Turtle with continuity without implying a fixed four-part rite.
      stewardship_network:
        dc: 27
        skills: [Society, Lore]
        result: Recover evidence that the keeper coordinated distributed observation, maintenance, restraint, adaptation, and ritual work across the village.
      traditional_tool_diagram:
        dc: 29
        skills: [Society, Lore]
        effect: Grants an advantage on Wolf's Tooth reconstruction or identifies optional Turtle/Bird practices.
    guidance: If the party has not already heard of the Hart, archive material can introduce it naturally as part of old local tradition.
    finale_position: Strongly favors continued rescue until the danger becomes undeniable because she sees the Hart as something Coedmyr was responsible for protecting.

restoration_support:
  fiction_rule: By FH-05 the party should have a plausible rescue theory assembled from demonstrated functions, not a deciphered ancient ritual.
  candidates:
    ewan: forest experience and personal responsibility
    sera: surviving ritual familiarity and strong commitment to rescue
    nessa: archaic-language access and cultural knowledge
    taran: physical reliability and material interpretation
    elara: organization and village authority
  no_helper: PCs supply the missing actions and coverage. Recruitment changes pressure and options rather than unlocking the finale.

creature_candidates:
  malformed_fauna:
    - Tar Zombie Predator chassis for malformed elk, deer, or wolves; remove undead assumptions and reflavor tar as badly organized tissue or runaway regeneration.
    - Giant Anaconda chassis for the tainted-water branch.
    - Mastodon chassis for an enormous malformed stag or moose brute.
  vegetation:
    - Snapdrake chassis for predatory malformed vegetation.
  liminal_taster:
    - Feathered Bear or Strong Guide chassis for a large beast with supernatural defenses; use only as mechanical inspiration rather than implying the Hart's finale state.
    - Phantom Beast as inspiration only; avoid importing precision immunity and broad incorporeal defenses wholesale.
  hart:
    target_level: 11
    note: Build custom around runaway vitality, malformed regeneration, pursuit pressure, and temporary stabilization rather than a predetermined mortal-transition mechanic.
